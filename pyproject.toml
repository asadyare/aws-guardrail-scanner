[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aws-guardrail-scanner"
version = "0.1.0"
description = "Read-only CLI that scans an AWS account for common security misconfigurations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asad Hassan" }]
keywords = ["aws", "security", "devsecops", "cis", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.40",
  "botocore>=1.40",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "boto3-stubs[cloudtrail,ec2,iam,s3,s3control,sts]>=1.40",
  "moto>=5.1",
  "mypy>=1.15",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
aws-guardrail-scanner = "aws_guardrail_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/asadyare/aws-guardrail-scanner"
Repository = "https://github.com/asadyare/aws-guardrail-scanner"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH", "RET"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aws_guardrail_scanner"]
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aws_guardrail_scanner --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["aws_guardrail_scanner"]
omit = ["src/aws_guardrail_scanner/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
